async function generateHash(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);

    const hashBuffer = await crypto.subtle.digest("SHA-256", data);

    const hashArray = Array.from(new Uint8Array(hashBuffer));

    const hashHex = hashArray
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");

    return hashHex;
}

/**
 * Add an object to both scenes, keeping the two meshes in sync via userData.
 * bloomMesh uses a simple MeshBasicMaterial (no lighting needed — it's only
 * rendered into the bloom buffer where we want pure colour, no shading).
 */
function addToBloom(mainMesh, bloomColor) {
    const color = new THREE.Color(bloomColor);

    let bloomMaterial;
    if (Array.isArray(mainMesh.material)) {
        bloomMaterial = mainMesh.material.map(() =>
            new THREE.MeshBasicMaterial({ color, toneMapped: false })
        );
    } else {
        bloomMaterial = new THREE.MeshBasicMaterial({ color, toneMapped: false });
    }

    const bloomMesh = mainMesh.clone();
    bloomMesh.material = bloomMaterial;

    // Keep references so we can sync transforms every frame
    mainMesh.userData.bloomMesh = bloomMesh;
    bloomScene.add(bloomMesh);
}

function syncBloomMeshes() {
    mainScene.traverse(obj => {
        if (obj.isMesh && obj.userData.bloomMesh) {
            const b = obj.userData.bloomMesh;
            b.position.copy(obj.position);
            b.rotation.copy(obj.rotation);
            b.scale.copy(obj.scale);
            b.matrixWorldNeedsUpdate = true;
        }
    });
}

// ─── PLATFORM FACTORY ─────────────────────────────────────────────────────────
function makePlatform(x, y, z, height, width, depth, platforms, color = 0x00ff00, id=null,
                      texture = 'studs.jpeg', opacity = 1.0, glow = 0.0,
                      rotx = 0, roty = 0, rotz = 0) {

    const loader = new THREE.TextureLoader();
    loader.load(texture, baseTexture => {
        baseTexture.wrapS = THREE.RepeatWrapping;
        baseTexture.wrapT = THREE.RepeatWrapping;

        const boxWidth  = width;
        const boxHeight = depth;
        const boxDepth  = height;
        const textureScale = 2;

        const faceSizes = [
            [boxDepth, boxHeight],
            [boxDepth, boxHeight],
            [boxWidth, boxDepth],
            [boxWidth, boxDepth],
            [boxWidth, boxHeight],
            [boxWidth, boxHeight],
        ];

        const materials = faceSizes.map(([fw, fh]) => {
            const tex = baseTexture.clone();
            tex.repeat.set(fw / textureScale, fh / textureScale);
            return new THREE.MeshStandardMaterial({
                color,
                transparent: opacity < 1,
                opacity,
                map: tex
            });
        });

        const platform = new THREE.Mesh(new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth), materials);
        platform.position.set(x, z, y);
        platform.rotation.set(rotx, rotz, roty);
        platform.castShadow    = true;
        platform.receiveShadow = true;

        mainScene.add(platform);
        platforms.push(platform);
        if (id) {
            ids[id] = platform;
        }
        // If this platform glows, mirror it into the bloom scene
        if (glow > 0) {
            addToBloom(platform, color);
        }
    });
}

    context.fillStyle = 'white';
    context.fillRect(0, 0, canvas.width, canvas.height);

    const sprite = new THREE.Sprite(material);

    group.add(leftLeg, rightLeg);

    group.scale.set(scale, scale, scale);
    group.userData = { leftArm, rightArm, leftLeg, rightLeg, walkTime: 0 };

        uniform sampler2D baseTexture;

            vec4 base  = texture2D(baseTexture,  vUv);

    `,
};

function animate() {
    requestAnimationFrame(animate);
    kc = keys['c'] || false;
    // Movement
    const direction = new THREE.Vector3();
    const speed = 0.1;
    const oldPosition = player.position.clone();

    if (keys['w']) direction.z -= 1;
    if (keys['s']) direction.z += 1;
    if (keys['a']) direction.x -= 1;
    if (keys['d']) direction.x += 1;
    direction.applyEuler(new THREE.Euler(0, yaw + Math.PI, 0)).normalize();

    if (!onGround) velocityY -= 0.01;
    onGround = false;
    player.position.y += velocityY;

    const bboxPlayer = new THREE.Box3().setFromObject(player);
    for (const p of platforms) {
        const bboxObj = new THREE.Box3().setFromObject(p);
        if (bboxPlayer.intersectsBox(bboxObj)) {
            if (player.position.y > p.position.y + p.geometry.parameters.height / 2) {
                onGround = true; standingPlatform = p; velocityY = 0; break;
            }
            player.position.y = oldPosition.y;
        }
    }

    let testPosition = player.position.clone();

    testPosition.x += direction.x * speed;
    let testBox = new THREE.Box3().setFromObject(player);
    let offset = testPosition.clone().sub(player.position); 
    testBox.translate(offset);
    let blocked = false;
    for (const p of platforms) {
        var bboxobj = new THREE.Box3().setFromObject(p);
        if (testBox.intersectsBox(bboxobj)) {
            if (standingPlatform != p || !onGround) {
                blocked=true;
                break;
            }
        }
    }

    if (!blocked) {
        player.position.x = testPosition.x;
    }

    testPosition = player.position.clone();

    testPosition.z += direction.z * speed;
    testBox = new THREE.Box3().setFromObject(player);
    offset = testPosition.clone().sub(player.position); 
    testBox.translate(offset);
    blocked = false;
    for (const p of platforms) {
        var bboxobj = new THREE.Box3().setFromObject(p);
        if (testBox.intersectsBox(bboxobj)) {
            if (standingPlatform != p || !onGround) {
                blocked=true;
                break;
            
            }
        }
    }
    if (!blocked){
        player.position.z = testPosition.z;
    }
    if (keys[' '] && onGround) { velocityY = 0.22; onGround = false; }
    // Camera
    const lookDir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
    );
    player.rotation.y = yaw + Math.PI;
    crosshair.style.display = 'block';
    const eyeOffset = new THREE.Vector3(0, 1.7, 0);
    const camPos = player.position.clone().add(eyeOffset);
    camera.position.copy(camPos);
    camera.lookAt(camPos.clone().add(lookDir));
    // Hide player mesh (first-person)
    player.traverse(c => { c.visible = false; });
    update(playerRef, {
        x: player.position.x,
        y: player.position.y,
        z: player.position.z,
        c: kc,
        angle: yaw
    });

    // Sync bloom-scene mirrors with main-scene transforms
    syncBloomMeshes();

    // ── Render ──
    // 1. Bloom pass: render only glowing objects in bloomScene
    bloomComposer.render();

    // 2. Final pass: render full mainScene, add bloom on top
    finalComposer.render();
    // Remove all generated platforms
}

function createCircleAlphaTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    // Create a smooth radial gradient
    const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gradient.addColorStop(0, 'white');    // Solid center
    gradient.addColorStop(0.8, 'white');  // Sharp edge threshold
    gradient.addColorStop(1, 'black');    // Fades out completely to black

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 256, 256);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

// Instantiate the circle mask at the top of your script
const circleAlphaMask = createCircleAlphaTexture();

onValue(ref(db, "scenes"), snapshot => {

    if (snapshot.exists()) {

        const data = snapshot.val() || {};

        for (const id in data){
            datids.push(id);

                makePlatform(parseFloat(data[id].x), parseFloat(data[id].y), parseFloat(data[id].z),

                            platforms, parseInt(data[id].color, 16), id, "studs.jpeg", 1.0, 0.0, 0.0, 0.0, parseFloat(data[id].angle));
                const blockNumber = parseInt(id.replace("i", ""));
                
                if (blockNumber > 4) {
                    const blockWidth  = parseFloat(data[id].w);
                    const blockDepth  = parseFloat(data[id].d);

                    const checkGroundInterval = setInterval(() => {
                        const groundMesh = ids["i1"];         
                        const currentBlock = ids[id];  
                        
                        if (groundMesh && groundMesh.isMesh && currentBlock && currentBlock.isMesh) {
                            clearInterval(checkGroundInterval); 
                            
                            // 1. Force state matrix evaluation
                            groundMesh.updateMatrixWorld(true);
                            currentBlock.updateMatrixWorld(true);

                            // 2. Extract the actual world coordinate of the newly spawned block
                            const blockWorldPos = new THREE.Vector3();
                            currentBlock.getWorldPosition(blockWorldPos);

                            // 3. Find the absolute top face of the ground floor mesh
                            const groundWorldPos = new THREE.Vector3();
                            groundMesh.getWorldPosition(groundWorldPos);
                            
                            // Calculate where the floor's top surface skin lives in absolute world units
                            const realFloorY = groundWorldPos.y + (parseFloat(currentBuild["i1"]?.[2] || 0) / 2);

                            // Assemble the target intersection point in world coordinates
                            const worldIntercept = new THREE.Vector3(blockWorldPos.x, realFloorY, blockWorldPos.z);

                            // 4. CRITICAL MATH FIX FOR DECALGEOMETRY:
                            // To make DecalGeometry find the mesh faces, we MUST feed it coordinates 
                            // as if the floor had an unscaled transformation matrix (1,1,1).
                            const originalScale = groundMesh.scale.clone();
                            groundMesh.scale.set(1, 1, 1);
                            groundMesh.updateMatrixWorld(true);

                            // Map the target spot directly into the ground's local unscaled system
                            const localProjectionPoint = worldIntercept.clone();
                            groundMesh.worldToLocal(localProjectionPoint);

                            // Orient the box flat along the horizontal floor surface plane
                            const orientation = new THREE.Euler(Math.PI / 2, 0, 0); 
                            
                            // Size vectors mapping scale: Make it 1.5x bigger than the block
                            const decalWidth = blockWidth * 1.5;
                            const decalHeight = blockDepth * 1.5;
                            const size = new THREE.Vector3(decalWidth, decalHeight, 2.0); 

                            // 5. Generate geometry safely inside the normalized bounds
                            const decalGeometry = new DecalGeometry(groundMesh, localProjectionPoint, orientation, size);

                            // 6. Instantly restore the true scale dimensions of your floor so it renders correctly
                            groundMesh.scale.copy(originalScale);
                            groundMesh.updateMatrixWorld(true);

                            // 7. Material mapping (Instantiated uniquely to fade independently)
                            const individualDecalMaterial = new THREE.MeshBasicMaterial({
                                map: decalTexture,
                                alphaMap: circleAlphaMask, // <-- CRITICAL: Layers the circle mask over the cracks
                                transparent: true,
                                opacity: 1.0,
                                depthTest: true,
                                depthWrite: false,      
                                polygonOffset: true,    
                                polygonOffsetFactor: -4 
                            });

                            const decalMesh = new THREE.Mesh(decalGeometry, individualDecalMaterial);
                            
                            // 8. CRITICAL PARENTING CHANGE: Add the decal as a child of the floor mesh
                            groundMesh.add(decalMesh); 

                            // ==========================================
                            // 5-SECOND LIFE TIMEOUT & VISUAL ANIMATION
                            // ==========================================
                            const startTime = performance.now();
                            const duration = 5000; 

                            function fadeAnimate() {
                                const elapsed = performance.now() - startTime;
                                const progress = elapsed / duration;

                                if (progress < 1) {
                                    // Start fading out over the final 1.5 seconds of the block's life
                                    if (progress > 0.7) {
                                        individualDecalMaterial.opacity = 1 - ((progress - 0.7) / 0.3);
                                    }
                                    requestAnimationFrame(fadeAnimate);
                                } else {
                                    // Garbage collection routine
                                    groundMesh.remove(decalMesh);
                                    decalGeometry.dispose();
                                    individualDecalMaterial.dispose();
                                }
                            }
                            requestAnimationFrame(fadeAnimate);
                        }
                    }, 50);
                }

            }
        }
        Object.keys(ids).forEach(id => {
            if (!datids.includes(id)){
                mainScene.remove(ids[id]);
                console.log("removed something")
                platforms.splice(platforms.indexOf(ids[id]), 1);
                if (ids[id].userData.bloomMesh) {
                    bloomScene.remove(ids[id].userData.bloomMesh);

                    if (Array.isArray(ids[id].userData.bloomMesh.material)) {
                        ids[id].userData.bloomMesh.material.forEach(m => m.dispose());
                    } else {
                        ids[id].userData.bloomMesh.material.dispose();
                    }
                }

                ids[id].geometry.dispose();

                if (Array.isArray(ids[id].material)) {
                    ids[id].material.forEach(mat => {
                        if (mat.map) mat.map.dispose();
                        mat.dispose();
                    });
                } else {
                    if (ids[id].material.map) ids[id].material.map.dispose();
                    ids[id].material.dispose();
                }
                delete ids[id];
            }
        });
        for (const id in data) {
            if (currentBuild[id] && !arraysEqual(currentBuild[id], [data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle])){
                console.log("updated something", currentBuild[id], [data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle]);
                for (let i = 0; i<[data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle].length; i++){
                    if ([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i] != currentBuild[id][i-1]) {
                        if (i == 0) ids[id].position.x = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]);
                        else if (i == 1) ids[id].position.z = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]);
                        else if (i == 2) ids[id].position.y = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]);
                        else if (i == 3) ids[id].scale.y = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]) / ids[id].geometry.parameters.height;
                        else if (i == 4) ids[id].scale.x = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]) / ids[id].geometry.parameters.width;
                        else if (i == 5) ids[id].scale.z = parseFloat([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i]) / ids[id].geometry.parameters.depth;
                        else if (i == 6) {
                            const color = new THREE.Color(parseInt([data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle][i], 16));
                            if (Array.isArray(ids[id].material)) {
                                ids[id].material.forEach(m => m.color.set(color));
                            } else {
                                ids[id].material.color.set(color);
                            }
                            if (ids[id].userData.bloomMesh) {
                                const bloomMat = ids[id].userData.bloomMesh.material;
                                if (Array.isArray(bloomMat)) {
                                    bloomMat.forEach(m => m.color.set(color));
                                } else {
                                    bloomMat.color.set(color);
                                }
                            }
                        }
                    }
                }
            }
            
        }
        for (const key in currentBuild) {
            if (currentBuild.hasOwnProperty(key)) {
                delete currentBuild[key];
            }
        }
        for (const id in data) {
            currentBuild[id] = [data[id].x, data[id].y, data[id].z, data[id].w, data[id].h, data[id].d, data[id].color, data[id].angle];
        }

    }
});

onValue(ref(db, "players"), snapshot => {
    const data = snapshot.val() || {};
    for (const id in data) {
        if (id === playerId) continue; // Skip self
        const pdata = data[id];
        if (!otherPlayers[id]) {
            let newPlayer;
            newPlayer = createPlayer(0xff0000);

            const nameTag = createNameTag(pdata.name || 'Player');
            nameTag.name = 'nameTag';
            newPlayer.add(nameTag);

            mainScene.add(newPlayer);
            otherPlayers[id] = newPlayer;
        }

        const other = otherPlayers[id];
        other.position.set(pdata.x, pdata.y, pdata.z);
        other.rotation.y = pdata.angle || 0;

        const existingTag = other.getObjectByName('nameTag');
        if (existingTag && existingTag.element && existingTag.element.innerText !== pdata.name) {
            existingTag.element.innerText = pdata.name || 'Player';
        }
    }

// Remove disconnected players...

    // Remove players who left
    for (const id in otherPlayers) {
        if (!data[id]) {
            mainScene.remove(otherPlayers[id]);
            delete otherPlayers[id];
        }
    }
});
